<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RKS506 Arcade Game</title>
<style>
  body { margin:0; background:#111; color:#eee; font-family:sans-serif; }
  header { text-align:center; padding:2rem 1rem 1rem; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
          gap:1rem; max-width:900px; margin:0 auto; padding:1rem; }
  .card { display:block; background:#1d1d1d; border:2px solid #333; border-radius:8px;
          padding:1.2rem; color:inherit; text-decoration:none; transition:.15s; }
  .card:hover, .card:focus { border-color:#4caf50; transform:translateY(-3px); }
  .icon { font-size:3rem; }
  .tag { font-size:.75rem; color:#4caf50; }
  footer { text-align:center; color:#777; padding:2rem; font-size:.8rem; }
</style>
</head>
<body>
<header><h1>RKS506 Arcade</h1><p>Pick a game</p></header>
<main class="grid">
  <a class="card" href="/static/games/snake.html">
    <div class="icon">🐍</div><h2>Snake</h2>
    <p>Eat, grow, don't hit the wall.</p><span class="tag">Arrows / WASD</span>
  </a>
  <a class="card" href="/static/games/minesweeper.html">
    <div class="icon">💣</div><h2>Minesweeper</h2>
    <p>Clear the 9×9 board.</p><span class="tag">Click / right-click to flag</span>
  </a>
  <a class="card" href="/static/games/2048.html">
    <div class="icon">🔢</div><h2>2048</h2>
    <p>Merge tiles to reach 2048.</p><span class="tag">Arrow keys / swipe</span>
  </a>
</main>
<footer>Built and deployed with CI/CD</footer>
</body>
</html>
