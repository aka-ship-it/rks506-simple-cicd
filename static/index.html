<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RKS506 Snake Game</title>
<style>
  body { margin:0; min-height:100vh; display:flex; flex-direction:column;
         align-items:center; justify-content:center; background:#111;
         color:#eee; font-family:sans-serif; }
  canvas { background:#000; border:2px solid #4caf50; max-width:95vw; }
</style>
</head>
<body>
<h1>Snake</h1>
<p>Score: <span id="score">0</span> | Arrows/WASD to move, Space to restart</p>
<canvas id="board" width="400" height="400"></canvas>
<script>
const SIZE = 20, CELLS = 20;
const ctx = document.getElementById("board").getContext("2d");
let snake, dir, nextDir, food, score, alive;

function reset() {
  snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir = {x:1,y:0}; nextDir = dir; score = 0; alive = true;
  placeFood();
  document.getElementById("score").textContent = 0;
  draw();
}
function placeFood() {
  do {
    food = {x: Math.floor(Math.random()*CELLS), y: Math.floor(Math.random()*CELLS)};
  } while (snake.some(s => s.x === food.x && s.y === food.y));
}
function step() {
  if (!alive) return;
  dir = nextDir;
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
  const hitWall = head.x < 0 || head.y < 0 || head.x >= CELLS || head.y >= CELLS;
  const hitSelf = snake.some(s => s.x === head.x && s.y === head.y);
  if (hitWall || hitSelf) { alive = false; draw(); return; }
  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score++;
    document.getElementById("score").textContent = score;
    placeFood();
  } else {
    snake.pop();
  }
  draw();
}
function draw() {
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, 400, 400);
  ctx.fillStyle = "#e53935"; ctx.fillRect(food.x*SIZE, food.y*SIZE, SIZE-1, SIZE-1);
  ctx.fillStyle = "#4caf50";
  snake.forEach(s => ctx.fillRect(s.x*SIZE, s.y*SIZE, SIZE-1, SIZE-1));
  if (!alive) {
    ctx.fillStyle = "#fff"; ctx.font = "26px sans-serif"; ctx.textAlign = "center";
    ctx.fillText("Game over - press Space", 200, 200);
  }
}
const keys = {ArrowUp:[0,-1], w:[0,-1], ArrowDown:[0,1], s:[0,1],
              ArrowLeft:[-1,0], a:[-1,0], ArrowRight:[1,0], d:[1,0]};
document.addEventListener("keydown", e => {
  if (e.key === " ") { e.preventDefault(); reset(); return; }
  const k = keys[e.key];
  if (!k) return;
  e.preventDefault();
  if (!(k[0] === -dir.x && k[1] === -dir.y)) nextDir = {x:k[0], y:k[1]};
});
reset();
setInterval(step, 120);
</script>
</body>
</html>
