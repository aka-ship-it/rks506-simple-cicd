<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2048</title>
<style>
  body { margin:0; min-height:100vh; display:flex; flex-direction:column;
         align-items:center; justify-content:center; background:#111; color:#eee;
         font-family:sans-serif; touch-action:none; }
  a { color:#4caf50; }
  #board { display:grid; grid-template-columns:repeat(4,80px); gap:6px;
           background:#222; padding:6px; border-radius:6px; }
  .t { width:80px; height:80px; display:flex; align-items:center;
       justify-content:center; font-size:24px; font-weight:bold; color:#111;
       border-radius:4px; }
</style>
</head>
<body>
<a href="/">← Library</a>
<h1>2048</h1>
<p>Score: <span id="score">0</span> | Arrows/WASD or swipe, Space to restart</p>
<div id="board"></div>
<script>
let b, score;
const el = document.getElementById("board");

function reset() {
  b = Array.from({length: 4}, () => Array(4).fill(0));
  score = 0; add(); add(); draw();
}
function add() {
  const e = [];
  b.forEach((r, y) => r.forEach((v, x) => { if (!v) e.push([x, y]); }));
  if (!e.length) return;
  const [x, y] = e[Math.floor(Math.random() * e.length)];
  b[y][x] = Math.random() < 0.9 ? 2 : 4;
}
function slide(row) {
  const r = row.filter(v => v);
  for (let i = 0; i < r.length - 1; i++) {
    if (r[i] === r[i + 1]) { r[i] *= 2; score += r[i]; r.splice(i + 1, 1); }
  }
  while (r.length < 4) r.push(0);
  return r;
}
function move(d) {
  const old = JSON.stringify(b), horiz = d === "L" || d === "R", rev = d === "R" || d === "D";
  for (let i = 0; i < 4; i++) {
    let line = [0, 1, 2, 3].map(j => horiz ? b[i][j] : b[j][i]);
    if (rev) line.reverse();
    line = slide(line);
    if (rev) line.reverse();
    line.forEach((v, j) => { if (horiz) b[i][j] = v; else b[j][i] = v; });
  }
  if (JSON.stringify(b) !== old) { add(); draw(); }
}
function draw() {
  el.innerHTML = "";
  b.flat().forEach(v => {
    const d = document.createElement("div");
    d.className = "t";
    d.textContent = v || "";
    d.style.background = v ? `hsl(${45 - Math.log2(v) * 4}, 85%, ${75 - Math.log2(v) * 3}%)` : "#333";
    el.appendChild(d);
  });
  document.getElementById("score").textContent = score;
}
const keys = {ArrowLeft:"L", a:"L", ArrowRight:"R", d:"R", ArrowUp:"U", w:"U", ArrowDown:"D", s:"D"};
document.addEventListener("keydown", e => {
  if (e.key === " ") { e.preventDefault(); reset(); return; }
  if (keys[e.key]) { e.preventDefault(); move(keys[e.key]); }
});
let sx, sy;
document.addEventListener("touchstart", e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; });
document.addEventListener("touchend", e => {
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 30) return;
  move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "R" : "L") : (dy > 0 ? "D" : "U"));
});
reset();
</script>
</body>
</html>
