name: Deploy

on:
  push:
    branches: [dev, main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: [self-hosted, staging]
    steps:
      - uses: actions/checkout@v4

      - name: Build image (tagged with commit SHA)
        run: docker build -t rks506-app:${{ github.sha }} .

      - name: Scan image (Trivy)
        run: |
          docker save rks506-app:${{ github.sha }} -o image.tar
          docker run --rm -v "$PWD:/work" -w /work aquasec/trivy:0.69.3 \
            image --input image.tar \
            --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1
          rm -f image.tar

  deploy-dev:
    if: github.ref == 'refs/heads/dev'
    needs: build
    runs-on: [self-hosted, staging]
    environment: dev
    concurrency: deploy-dev
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/deploy.sh dev ${{ github.sha }} 8081

  deploy-staging:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: [self-hosted, staging]
    environment: staging
    concurrency: deploy-staging
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/deploy.sh staging ${{ github.sha }} 8082

  deploy-prod:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, staging]
    environment: production
    concurrency: deploy-prod
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/deploy.sh prod ${{ github.sha }} 80

