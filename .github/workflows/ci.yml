name: CI

on:
  pull_request:
    branches: [main]

jobs:
  quality-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run pytest
        run: python -m pytest

      - name: Run Pylint
        run: pylint --fail-under=9.0 app.py

      - name: Run Semgrep
        run: |
          pip install semgrep
          semgrep scan --config p/python --error .

  docker-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint Dockerfile (Hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      - name: Build image
        run: docker build -t rks506-app:ci .

      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: rks506-app:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Run container and smoke test
        run: |
          docker run -d --name test -p 5000:5000 rks506-app:ci
          for i in $(seq 1 15); do
            curl -fs http://localhost:5000/ | grep -q "Hello from RKS506" && exit 0
            sleep 2
          done
          docker logs test
          exit 1

